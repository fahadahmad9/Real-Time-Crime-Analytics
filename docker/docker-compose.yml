services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: crime_analytics
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - ../db/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: crime_analytics
    volumes:
      - mongo_data:/data/db

  spark:
    image: apache/spark:3.5.0
    container_name: spark
    entrypoint: ["/opt/spark/sbin/start-master.sh"]
    environment:
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ../data:/app/data
      - ../spark:/app/spark
      - ../config:/app/config

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    depends_on:
      - spark
    entrypoint: ["/opt/spark/sbin/start-worker.sh", "spark://spark:7077"]
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ../data:/app/data
      - ../spark:/app/spark
      - ../config:/app/config

  storm-nimbus:
    image: storm:2.6
    container_name: storm-nimbus
    command: storm nimbus
    depends_on:
      - zookeeper
    ports:
      - "6627:6627"
    volumes:
      - ../storm:/app/storm
      - ../config:/app/config
    environment:
      - STORM_ZOOKEEPER_SERVERS=zookeeper

  storm-supervisor:
    image: storm:2.6
    container_name: storm-supervisor
    command: storm supervisor
    depends_on:
      - storm-nimbus
      - zookeeper
    volumes:
      - ../storm:/app/storm
      - ../config:/app/config
    environment:
      - STORM_ZOOKEEPER_SERVERS=zookeeper

  storm-ui:
    image: storm:2.6
    container_name: storm-ui
    command: storm ui
    depends_on:
      - storm-nimbus
    ports:
      - "8081:8080"
    environment:
      - STORM_ZOOKEEPER_SERVERS=zookeeper

volumes:
  postgres_data:
  mongo_data:
